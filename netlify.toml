[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Alte synchrone Route /api/generate auf die Background-Function umbiegen,
# falls noch ein Client den alten Pfad aufruft.
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate-background"
  status = 308

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
